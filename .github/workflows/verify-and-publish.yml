name: Verify and publish Loon artifacts

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "template/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/verify-and-publish.yml"

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and verify
        run: npm run verify
      - name: Commit generated release artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          if git diff --cached --quiet; then
            echo "Generated release artifacts are already up to date."
          else
            git commit -m "Build Loon artifacts with 15-second minimum timeouts"
            git push origin HEAD:main
          fi