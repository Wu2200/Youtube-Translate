name: Build ten-second translation window
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-ten-second-window.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify ten-second source behavior
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const core = fs.readFileSync("src/yt-ai-core.js", "utf8");
          const loon = fs.readFileSync("src/yt-ai-loon.js", "utf8");
          const template = fs.readFileSync("template/YouTube.AI.Translate.plugin", "utf8");
          if (!/maxWaitMs:\s*10000/.test(core)) throw new Error("Core default is not 10000 ms");
          if (!/\n\s*10000\n\s*\)/.test(core)) throw new Error("Core maxWaitMs limit is not 10000 ms");
          if (!loon.includes("const CLIENT_SAFE_MAX_WAIT_MS = 10000;")) throw new Error("Loon client limit is not 10000 ms");
          if (!loon.includes("let executionDeadline = isBackgroundPing ? Date.now() + BACKGROUND_BUDGET_MS : 0;")) throw new Error("Foreground deadline is not deferred until subtitle parsing");
          if (!template.includes("requires-body=1, max-size=0, script-path={{SCRIPT_URL}}, timeout=12, tag=AI 字幕响应")) throw new Error("Subtitle response timeout does not allow the 10-second translation window");
          NODE
      - name: Build and run all tests
        run: npm run verify
      - name: Verify generated release artifacts
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const bundle = fs.readFileSync("dist/dualsubs-ai.bundle.js", "utf8");
          const legacyBundle = fs.readFileSync("dist/yt-ai.bundle.js", "utf8");
          const manifest = JSON.parse(fs.readFileSync("dist/manifest.json", "utf8"));
          const plugin = fs.readFileSync("dist/YouTube.AI.Translate.remote.plugin", "utf8");
          const digest = crypto.createHash("sha256").update(bundle).digest("hex");
          if (digest !== manifest.sha256) throw new Error("Generated bundle hash does not match manifest");
          if (bundle !== legacyBundle) throw new Error("Compatibility bundle is out of sync");
          if (!bundle.includes("const CLIENT_SAFE_MAX_WAIT_MS = 10000;")) throw new Error("Release bundle does not contain the 10-second limit");
          if (!plugin.includes("timeout=12, tag=AI 字幕响应")) throw new Error("Published plugin response timeout is not updated");
          NODE
      - name: Commit release artifacts and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          git rm .github/workflows/build-ten-second-window.yml
          git commit -m "Build ten-second initial translation release"
          git push origin HEAD:main
