name: Build caption features
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run verify
      - name: Publish verified artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          git rm .github/workflows/build-caption-features.yml
          git commit -m "Build automatic captions and preview filtering"
          git push origin HEAD:main