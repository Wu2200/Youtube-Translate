^https?:\/\/s\.youtube\.com\/api\/stats\/(watchtime|qoe|playback)(\?.*)?$ url script-request-header https://raw.githubusercontent.com/Wu2200/Youtube-Translate/main/dist/dualsubs-ai.bundle.js

hostname = www.youtube.com, m.youtube.com, s.youtube.com
